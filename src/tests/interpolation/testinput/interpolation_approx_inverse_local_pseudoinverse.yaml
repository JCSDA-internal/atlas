  - test name: regional_x2_staggered
    source grid:
      type: regional
      nx: 100
      ny: 100
      north: 54.775
      south: -34.775
      west: 55.225
      east: 144.775
    target grid:
      type: regional
      nx: 51
      ny: 51
      north: 55.
      south: -35.
      west: 55.
      east: 145.
    source mesh generator:
      type: structured
    target mesh generator:
      type: structured
    source partitioner:
      type: checkerboard
    target partitioner:
      type: checkerboard
    source halo: 3
    target halo: 2
    interpolation:
      type: spherical-mean-value
      treat_failure_as_missing_value: false

conjugate gradient least squares:
  test name: cgls_comparison
  source grid:
    type: regional
    nx: 100
    ny: 100
    north: 54.775
    south: -34.775
    west: 55.225
    east: 144.775
  target grid:
    type: regional
    nx: 51
    ny: 51
    north: 55.
    south: -35.
    west: 55.
    east: 145.
  source mesh generator:
    type: structured
  target mesh generator:
    type: structured
  source partitioner:
    type: checkerboard
  target partitioner:
    type: checkerboard
  source halo: 3
  target halo: 2
  interpolation:
    type: spherical-mean-value
    treat_failure_as_missing_value: false
  max iterations: 4
  tolerance: 1e-10
  
visualise inverse interpolation kernel:
  source grid:
    name: CS-LFR-25
  target grid:
    name: CS-LFR-5
  source mesh generator:
    type: cubedsphere_dual
  target mesh generator:
    type: cubedsphere_dual
  source partitioner:
    type: cubedsphere
  target partitioner:
    type: cubedsphere
  source halo: 3
  target halo: 0
  interpolation:
    type: spherical-mean-value
    treat_failure_as_missing_value: false
  plot rank: 0
  plot rows: [0, 2, 4, 10, 12, 14, 20, 22, 24]

inverse interpolation:
  type: local-pseudoinverse
write gmsh: true

runs:
  - test name: cubedsphere_x2
    source grid:
      name: CS-LFR-28
    target grid:
      name: CS-LFR-14
    source mesh generator:
      type: cubedsphere_dual
    target mesh generator:
      type: cubedsphere_dual
    source partitioner:
      matching mesh: true
      type: cubedsphere
    target partitioner:
      type: equal_regions
      coordinates: lonlat
    source halo: 1
    target halo: 0
    interpolation:
      type: spherical-mean-value
      treat_failure_as_missing_value: false

  - test name: cubedsphere_x3
    source grid:
      name: CS-LFR-42
    target grid:
      name: CS-LFR-14
    source mesh generator:
      type: cubedsphere_dual
    target mesh generator:
      type: cubedsphere_dual
    source partitioner:
      matching mesh: true
      type: cubedsphere
    target partitioner:
      type: equal_regions
      coordinates: lonlat
    source halo: 3
    target halo: 0
    interpolation:
      type: spherical-mean-value
      treat_failure_as_missing_value: false

  - test name: cubedsphere_x4
    source grid:
      name: CS-LFR-56
    target grid:
      name: CS-LFR-14
    source mesh generator:
      type: cubedsphere_dual
    target mesh generator:
      type: cubedsphere_dual
    source partitioner:
      matching mesh: true
      type: cubedsphere
    target partitioner:
      type: cubedsphere
    source halo: 3
    target halo: 0
    interpolation:
      type: spherical-mean-value
      treat_failure_as_missing_value: false

  - test name: regional_x3_aligned
    source grid:
      type: regional
      nx: 76
      ny: 76
      north: 55.
      south: -35.
      west: 55.
      east: 145.
    target grid:
      type: regional
      nx: 26
      ny: 26
      north: 55.
      south: -35.
      west: 55.
      east: 145.
    source mesh generator:
      type: structured
    target mesh generator:
      type: structured
    source partitioner:
      type: checkerboard
    target partitioner:
      type: checkerboard
    source halo: 5
    target halo: 2
    interpolation:
      type: spherical-mean-value
      treat_failure_as_missing_value: false

  - test name: regional_x2_staggered
    source grid:
      type: regional
      nx: 50
      ny: 50
      north: 54.55
      south: -34.55
      west: 55.45
      east: 144.55
    target grid:
      type: regional
      nx: 26
      ny: 26
      north: 55.
      south: -35.
      west: 55.
      east: 145.
    source mesh generator:
      type: structured
    target mesh generator:
      type: structured
    source partitioner:
      type: checkerboard
    target partitioner:
      type: checkerboard
    source halo: 3
    target halo: 2
    interpolation:
      type: spherical-mean-value
      treat_failure_as_missing_value: false

visualise inverse interpolation kernel:
  source grid:
    name: CS-LFR-25
  target grid:
    name: CS-LFR-5
  source mesh generator:
    type: cubedsphere_dual
  target mesh generator:
    type: cubedsphere_dual
  source partitioner:
    type: cubedsphere
  target partitioner:
    type: cubedsphere
  source halo: 3
  target halo: 0
  interpolation:
    type: spherical-mean-value
    treat_failure_as_missing_value: false
  plot rank: 0
  plot rows: [0, 2, 4, 10, 12, 14, 20, 22, 24]